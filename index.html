<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HW9 Heart Rate Monitor</title>
<style>
  body { font-family: system-ui; background:#0b0f1a; color:#e6edf3; text-align:center; margin:0; padding:24px; }
  #bpm { font-size:96px; font-weight:700; color:#ff4d6d; margin:16px 0 0; }
  #status { color:#8b949e; min-height:1.5em; }
  button { font-size:16px; padding:12px 20px; margin:6px; border-radius:8px; border:none; cursor:pointer; }
  canvas { width:100%; max-width:800px; height:240px; background:#111827; border-radius:12px; margin-top:16px; }
</style>
</head>
<body>
  <h2>COOSPO HW9 · Live Heart Rate</h2>
  <button id="connect">연결</button>
  <button id="disconnect">해제</button>
  <button id="csv">CSV 저장</button>
  <div id="bpm">--</div>
  <div id="status">대기 중</div>
  <canvas id="chart" width="800" height="240"></canvas>

<script>
let device, log = [], wakeLock = null;
const $ = id => document.getElementById(id);

if (!navigator.bluetooth) {
  $('status').textContent = '이 브라우저는 Web Bluetooth를 지원하지 않습니다. Android Chrome을 사용하세요.';
}

function parseHeartRate(dv) {
  const flags = dv.getUint8(0);
  let i = 1, hr;
  if (flags & 0x01) { hr = dv.getUint16(i, true); i += 2; }
  else              { hr = dv.getUint8(i);        i += 1; }
  const contact = (flags & 0x04) ? !!(flags & 0x02) : null;
  if (flags & 0x08) i += 2;
  const rr = [];
  if (flags & 0x10) for (; i + 1 < dv.byteLength; i += 2) rr.push(dv.getUint16(i, true) * 1000 / 1024);
  return { hr, contact, rr };
}

function onMeasurement(e) {
  const { hr, contact, rr } = parseHeartRate(e.target.value);
  const t = Date.now();
  log.push({ t, hr, rr: rr.map(x => x.toFixed(1)).join('|') });
  $('bpm').textContent = hr;
  $('status').textContent =
    `접촉: ${contact === null ? 'N/A' : contact ? 'OK' : '없음'} · RR: ${rr.length ? rr.map(x=>x.toFixed(0)).join(', ')+' ms' : '미제공'} · ${log.length}개 기록`;
  draw();
}

function draw() {
  const c = $('chart'), g = c.getContext('2d');
  const data = log.slice(-120);
  g.clearRect(0, 0, c.width, c.height);
  if (data.length < 2) return;
  const min = 40, max = 200;
  g.strokeStyle = '#ff4d6d'; g.lineWidth = 2; g.beginPath();
  data.forEach((d, k) => {
    const x = k / 119 * c.width;
    const y = c.height - (d.hr - min) / (max - min) * c.height;
    k ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
}

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock.request('screen'); }
  catch (e) { console.log('Wake Lock 실패:', e.message); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && device?.gatt?.connected) keepAwake();
});

$('connect').onclick = async () => {
  try {
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
    device.addEventListener('gattserverdisconnected', () => {
      $('status').textContent = '연결 끊김';
      wakeLock?.release(); wakeLock = null;
    });
    $('status').textContent = `${device.name} 연결 중...`;
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService('heart_rate');
    const ch = await service.getCharacteristic('heart_rate_measurement');
    ch.addEventListener('characteristicvaluechanged', onMeasurement);
    await ch.startNotifications();
    $('status').textContent = `${device.name} 수신 중`;
    keepAwake();
  } catch (err) { $('status').textContent = '오류: ' + err.message; }
};

$('disconnect').onclick = () => device?.gatt?.connected && device.gatt.disconnect();

$('csv').onclick = () => {
  if (!log.length) { $('status').textContent = '저장할 데이터가 없습니다'; return; }
  const rows = ['timestamp_ms,iso_time,hr_bpm,rr_ms',
    ...log.map(d => `${d.t},${new Date(d.t).toISOString()},${d.hr},${d.rr}`)];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' }));
  a.download = `hw9_${Date.now()}.csv`; a.click();
};
</script>
</body>
</html>
